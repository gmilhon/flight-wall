<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0b" />
  <title>Flight Wall — Display</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css?v=2" />
  <link rel="stylesheet" href="/css/common.css?v=2" />
  <link rel="stylesheet" href="/css/display.css?v=2" />
  <script src="/vendor/leaflet/leaflet.js?v=2"></script>
</head>
<body>
  <div id="app" data-theme="departure" data-mode="area">
    <header id="hdr">
      <div class="brand"><span class="logo">✈</span> FLIGHT WALL</div>
      <div class="ctx">
        <span id="homeLabel" class="home"></span>
        <span id="modeLabel" class="pill"></span>
      </div>
      <div class="right">
        <span id="clock" class="clock">--:--:--</span>
        <button id="muteBtn" class="fs" title="Mute ATC audio" aria-label="Mute audio" hidden>🔊</button>
        <button id="fsBtn" class="fs" title="Toggle full screen" aria-label="Full screen">⛶</button>
      </div>
    </header>

    <main id="main">
      <section id="board" class="board"></section>
      <aside id="sideWrap" class="side" hidden>
        <div id="mapEl" class="map"></div>
        <canvas id="radar" class="radar-canvas" hidden></canvas>
        <div id="rangeLabel" class="range"></div>
      </aside>
    </main>

    <footer id="foot">
      <span id="status" class="status"></span>
      <span id="audioBar" class="audio-bar" hidden></span>
      <span id="count" class="count"></span>
      <span id="stamp" class="stamp"></span>
    </footer>

    <button id="audioGate" class="audio-gate" hidden>🔊 Tap to enable ATC audio</button>
    <div id="alert" class="alert" hidden></div>
  </div>
  <script type="module" src="/js/display.js?v=2"></script>
</body>
</html>
